<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Botão Acessível de Leitura por Voz -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Interativa do Fogão</title>
    <style>
        /* Contêiner relativo para alinhar os botões exatamente sobre a imagem */
        .fogao-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 400px; /* Largura máxima da imagem */
        }

        .fogao-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Estilo base dos botões invisíveis posicionados por porcentagem */
        .btn-overlay {
            position: absolute;
            top: 41.5%; /* Altura exata da linha de botões */
            width: 11%;
            height: 10%;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.2); /* Azul transparente para você enxergar onde clicar */
            border: 2px solid #2563eb;
            cursor: pointer;
            padding: 0;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-overlay:hover {
            background: rgba(37, 99, 235, 0.5);
            transform: scale(1.1);
        }

        .btn-overlay:active {
            transform: scale(0.95);
        }

        /* Posicionamento horizontal exato de cada botão na sua imagem */
        #btn-oven { left: 11.5%; }
        #btn-lf   { left: 28.5%; }
        #btn-lr   { left: 44.5%; }
        #btn-rr   { left: 61.5%; }
        #btn-rf   { left: 77.5%; }

        .visor-status {
            background-color: #000000;
            color: #facc15;
            font-family: monospace;
            font-size: 1.1rem;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #facc15;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f8fafc; padding: 20px;">
    

    <main style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 8px;">
        
        <h2>Interface Interativa do Fogão</h2>
        <p>Clique sobre os botões destacados na imagem para interagir:</p>
        

        <!-- Visor dinâmico que atualiza o status -->
        <div id="visor-fogao" class="visor-status" aria-live="polite" role="status">
            PAINEL PRONTO — CLIQUE EM UM BOTÃO DA IMAGEM
        </div>

        <!-- Contêiner do Fogão com Botões Transparentes Posicionados -->
        <div class="fogao-wrapper">
            <img src="show.png" alt="Fogão Interativo">

            <!-- Botões interativos alinhados por porcentagem sobre cada seletor da imagem -->
            <button id="btn-oven" class="btn-overlay" title="Forno (OVEN)" onclick="interagir('Forno (OVEN)')" aria-label="Forno"></button>
            <button id="btn-lf"   class="btn-overlay" title="Frontal Esquerdo (LF)" onclick="interagir('Frontal Esquerdo (LF)')" aria-label="Frontal Esquerdo"></button>
            <button id="btn-lr"   class="btn-overlay" title="Traseiro Esquerdo (LR)" onclick="interagir('Traseiro Esquerdo (LR)')" aria-label="Traseiro Esquerdo"></button>
            <button id="btn-rr"   class="btn-overlay" title="Traseiro Direito (RR)" onclick="interagir('Traseiro Direito (RR)')" aria-label="Traseiro Direito"></button>
            <button id="btn-rf"   class="btn-overlay" title="Frontal Direito (RF)" onclick="interagir('Frontal Direito (RF)')" aria-label="Frontal Direito"></button>
        </div>
    </main>

    <script>
        const estados = {};

        function emitirSom(freq) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function interagir(nome) {
            const visor = document.getElementById('visor-fogao');
            estados[nome] = !estados[nome];

            if (estados[nome]) {
                visor.innerText = `STATUS: ${nome.toUpperCase()} LIGADO`;
                emitirSom(880);
            } else {
                visor.innerText = `STATUS: ${nome.toUpperCase()} DESLIGADO`;
                emitirSom(330);
            }

            if ('vibrate' in navigator) {
                navigator.vibrate(80);
            }
        }
    </script>
</body>
</html>
